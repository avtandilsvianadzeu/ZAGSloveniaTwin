# Desktop builds of the DigitalZAG: a Windows installer and portable .exe, a macOS disk image and a Linux AppImage.
# Runs on every tag v*, and by hand. Both publish one GitHub release, v<version from desktop/package.json>, with the files to download.
name: Desktop builds
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            files: desktop/dist/*.exe
          - os: macos-latest
            script: dist:mac
            files: desktop/dist/*.dmg
          - os: ubuntu-latest
            script: dist:linux
            files: desktop/dist/*.AppImage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Build
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: ${{ matrix.files }}
          retention-days: 30
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: v
        run: echo "tag=v$(node -p "require('./desktop/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.v.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: DigitalZAG ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.v.outputs.tag }}
          body: |
            DigitalZAG as a desktop application. The pages, data, 3D models and ZAGBot are inside the application and work offline; map tiles and live news come from the internet.
            Windows: download the installer (the file ending in win-x64.exe) or the portable .exe, which runs without installing. Windows SmartScreen may ask once: choose More info, then Run anyway. The application is not signed with a certificate.
            macOS: the .dmg. Linux: the .AppImage.
          files: out/**/*
