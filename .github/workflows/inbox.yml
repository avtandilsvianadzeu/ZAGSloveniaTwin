# Deploys the object inbox (server/inbox.js) to Cloudflare Workers, free plan. Runs by hand and when server/ changes.
# Needs these repository secrets, added by the owner: CLOUDFLARE_API_TOKEN (Workers and KV edit), CLOUDFLARE_ACCOUNT_ID,
# INBOX_GITHUB_TOKEN (fine-grained, this repository only, Contents read and write), ACCESS_TEAM, ACCESS_AUD.
name: Object inbox
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/inbox.yml']
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the secrets
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$T" ] || [ -z "$A" ]; then echo "::notice::Cloudflare secrets are not set yet, nothing deployed."; echo "skip=1" >> "$GITHUB_ENV"; fi
      - name: Queue storage (created once)
        if: env.skip != '1'
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          id=$(npx -y wrangler@3.90.0 kv namespace list | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const a=JSON.parse(s.slice(s.indexOf('[')));const n=a.find(x=>/digitalzag-inbox-QUEUE$/.test(x.title));process.stdout.write(n?n.id:'')})")
          if [ -z "$id" ]; then npx -y wrangler@3.90.0 kv namespace create QUEUE; id=$(npx -y wrangler@3.90.0 kv namespace list | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const a=JSON.parse(s.slice(s.indexOf('[')));process.stdout.write(a.find(x=>/digitalzag-inbox-QUEUE$/.test(x.title)).id)})"); fi
          sed -i "s/KV_ID/$id/" wrangler.toml
          sed -i "s/^ACCESS_TEAM = \"\"/ACCESS_TEAM = \"${{ secrets.ACCESS_TEAM }}\"/; s/^ACCESS_AUD = \"\"/ACCESS_AUD = \"${{ secrets.ACCESS_AUD }}\"/" wrangler.toml
      - name: Deploy
        if: env.skip != '1'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: server
          wranglerVersion: '3.90.0'
          secrets: GITHUB_TOKEN
        env:
          GITHUB_TOKEN: ${{ secrets.INBOX_GITHUB_TOKEN }}
