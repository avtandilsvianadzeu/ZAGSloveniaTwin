name: Refresh news

# Reads zag.si (data/zag_news.json), the ZAG media monitor and news per structure (data/news.json).
# GitHub starts scheduled runs only when it has capacity, often hours apart. So one run keeps checking every
# 20 minutes for about five and a half hours, and then starts the next run itself. The hourly schedule restarts
# the chain if it ever stops. data/news_status.json records the time of every check, so the site shows when it last looked.
on:
  schedule:
    - cron: '11 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  actions: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check every 20 minutes
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          for i in $(seq 1 16); do
            git pull --rebase -q || true
            node tools/fetch_zag_news.mjs || true
            if [ $((i % 3)) -eq 1 ]; then node tools/fetch_news.mjs || true; fi
            # new news goes out at once; when nothing changed, the time of the last check is saved once an hour,
            # so the site is rebuilt at most a few times an hour (GitHub Pages allows about 10 builds an hour).
            # The push itself starts the site build.
            git add data/news.json data/zag_news.json
            if ! git diff --cached --quiet || [ $((i % 3)) -eq 1 ]; then
              printf '{"checked":"%s","by":"news workflow, every 20 minutes"}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > data/news_status.json
              git add data/news_status.json
            fi
            if ! git diff --cached --quiet; then
              git commit -q -m "Update news"
              git pull --rebase -q || true
              git push -q || true
            fi
            [ "$i" -lt 16 ] && sleep 1200
          done
      - name: Start the next run
        if: always()
        run: gh api -X POST "repos/${{ github.repository }}/actions/workflows/news.yml/dispatches" -f ref=main || true
