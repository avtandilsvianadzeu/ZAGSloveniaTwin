name: Partner radar

# Reads the public websites of ZAG project partners once a day (data/partners.json), and adds projects found in
# CORDIS where ZAG is a participant (data/international.json, data/intl_updates.json):
# AI and infrastructure topics, the contact page and generic institutional addresses only.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: partners
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Read partner websites
        run: node tools/fetch_partners.mjs
      - name: Sync projects from CORDIS and zag.si
        run: node tools/sync_cordis.mjs || true
      - name: Build the ZAG Radar brief
        run: node tools/build_brief.mjs || true
      - name: Save if changed
        run: |
          if [ -z "$(git status --porcelain -- data/partners.json data/international.json data/intl_updates.json data/brief.json data/brief_state.json data/briefs)" ]; then
            echo "No change."
          else
            git config user.name "partner-radar"
            git config user.email "partner-radar@users.noreply.github.com"
            git add data/partners.json data/international.json data/intl_updates.json data/brief.json data/brief_state.json data/briefs
            git commit -m "Update partner radar"
            git pull --rebase -q || true
            git push
            gh api -X POST "repos/${{ github.repository }}/pages/builds" >/dev/null 2>&1 || true
          fi
