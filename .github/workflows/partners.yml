name: EU project sync

# Once a day: adds projects found in CORDIS where ZAG is a participant (data/international.json, data/intl_updates.json).
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: partners
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Sync projects from CORDIS and zag.si
        run: node tools/sync_cordis.mjs || true
      - name: Save if changed
        run: |
          if [ -z "$(git status --porcelain -- data/international.json data/intl_updates.json)" ]; then
            echo "No change."
          else
            git config user.name "partner-radar"
            git config user.email "partner-radar@users.noreply.github.com"
            git add data/international.json data/intl_updates.json
            git commit -m "Update partner radar"
            git pull --rebase -q || true
            git push
            gh api -X POST "repos/${{ github.repository }}/pages/builds" >/dev/null 2>&1 || true
          fi
